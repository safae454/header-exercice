<p>{{ count() }} tâche(s)</p>

<input [(ngModel)]="newTitle" placeholder="Titre de la tâche" />
<button (click)="addTask()" [disabled]="newTitle().trim() === ''">Ajouter une tâche</button>
<button (click)="clear()">Vider la liste</button>

@if (count() === 0) {
  <p class="empty">Aucune tâche pour l'instant</p>
} @else {
  <ul>
    @for (task of tasks(); track task.id) {
      <li>
        {{ task.title | uppercase }} - {{ task.dueDate | date: 'dd/MM/yyyy' }}
        <button (click)="remove(task.id)">Supprimer</button>
      </li>
    }
  </ul>
}
